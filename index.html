<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Ваш подарок — Перекрёсток</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --g950: oklch(16% 0.08 148);
      --g900: oklch(22% 0.11 148);
      --g800: oklch(30% 0.14 148);
      --g700: oklch(37% 0.16 148);
      --g600: oklch(44% 0.18 148);
      --g500: oklch(51% 0.19 148);
      --g400: oklch(60% 0.17 148);
      --g300: oklch(70% 0.14 148);
      --g200: oklch(83% 0.08 148);
      --g100: oklch(93% 0.04 148);
      --g050: oklch(97% 0.02 148);
      --au3: oklch(84% 0.17 82);
      --au2: oklch(74% 0.18 78);
      --au1: oklch(60% 0.15 72);
      --muted: oklch(50% 0.03 148);
      --border: oklch(87% 0.03 148);
      --surf: oklch(99% 0.005 148);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--g950);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      touch-action: none;
    }

    #ccvs, #pcvs {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 300;
    }

    .scene {
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px 40px;
    }

    .card {
      width: 100%; max-width: 400px;
      background: var(--surf);
      border-radius: 28px; overflow: hidden;
      box-shadow:
        0 0 0 1px oklch(100% 0 0 / .07),
        0 32px 80px oklch(0% 0 0 / .55),
        0 8px 20px  oklch(0% 0 0 / .25);
    }

    /* ── Header ─── */
    .card-header {
      position: relative; overflow: hidden;
      background: var(--g600);
      padding: 32px 28px 44px; text-align: center;
    }
    .card-header::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 65% 55% at 50% 25%, oklch(62% 0.2 148 / .5) 0%, transparent 70%),
        radial-gradient(ellipse 90% 50% at 50% 110%, var(--g800) 0%, transparent 70%);
      pointer-events: none;
    }
    .brand {
      position: relative;
      font-size: 10.5px; font-weight: 700;
      letter-spacing: .15em; text-transform: uppercase;
      color: oklch(88% 0.09 148); margin-bottom: 18px;
    }
    .gift-wrap {
      position: relative; width: 92px; height: 92px;
      margin: 0 auto 18px;
      animation: gift-float 3.4s ease-in-out infinite;
    }
    @keyframes gift-float {
      0%,100% { transform: translateY(0) rotate(0deg); }
      40%      { transform: translateY(-10px) rotate(-1.8deg); }
      70%      { transform: translateY(-5px) rotate(1.2deg); }
    }
    .header-title {
      position: relative;
      font-size: 27px; font-weight: 900;
      color: #fff; letter-spacing: -.45px; line-height: 1.15; margin-bottom: 5px;
    }
    .header-sub {
      position: relative;
      font-size: 13.5px; font-weight: 500; color: oklch(88% 0.07 148);
    }

    /* ── Body ─── */
    .card-body {
      padding: 22px 20px 26px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }

    /* ── Scratch zone ─── */
    .scratch-zone {
      width: 100%; position: relative;
      border-radius: 16px; overflow: hidden;
      aspect-ratio: 2 / 1;
      touch-action: none; cursor: crosshair;
      box-shadow: inset 0 0 0 1.5px oklch(60% 0.05 148), 0 4px 24px oklch(0% 0 0 / .08);
    }
    #cvsPrize {
      position: absolute; inset: 0;
      width: 100%; height: 100%; border-radius: 16px;
    }
    #cvsFoil {
      position: absolute; inset: 0;
      width: 100%; height: 100%; border-radius: 16px;
      transition: opacity .65s ease;
    }
    #cvsFoil.fading { opacity: 0; pointer-events: none; }

    /* ── Hint ─── */
    .hint {
      display: flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 500; color: var(--muted);
      transition: opacity .35s;
    }
    .hint.gone { opacity: 0; pointer-events: none; }
    .hint-hand { display: inline-block; font-size: 16px; animation: hint-swipe 1.9s ease-in-out infinite; }
    @keyframes hint-swipe {
      0%,100% { transform: translateX(-5px); opacity: .65; }
      50%      { transform: translateX(6px); opacity: 1; }
    }

    /* ── Progress ─── */
    .prog-track {
      width: 100%; height: 4px;
      background: var(--g100); border-radius: 99px; overflow: hidden; transition: opacity .35s;
    }
    .prog-track.gone { opacity: 0; }
    .prog-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--g500), var(--g300));
      border-radius: 99px; transition: width .07s linear;
    }

    /* ══ BUTTONS ══ */
    .btn {
      position: relative; overflow: hidden;
      width: 100%; height: 56px; padding: 0 24px;
      border: none; border-radius: 99px;
      font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: -.15px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .12s ease, opacity .3s ease;
    }
    /* shimmer sweep */
    .btn::after {
      content: ''; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, oklch(100% 0 0 / .22), transparent);
      transform: skewX(-18deg);
      animation: btn-sweep 3.2s ease-in-out infinite;
    }
    @keyframes btn-sweep {
      0%,55%  { left: -80%; }
      70%      { left: 130%; }
      71%,100% { left: 130%; opacity: 0; }
    }
    /* ripple */
    .ripple {
      position: absolute; border-radius: 50%;
      background: oklch(100% 0 0 / .28);
      transform: scale(0); pointer-events: none;
      animation: ripple-expand .6s ease-out forwards;
    }
    @keyframes ripple-expand { to { transform: scale(4); opacity: 0; } }

    /* Green */
    .btn-clear {
      background: linear-gradient(155deg, var(--g400) 0%, var(--g600) 55%, var(--g800) 100%);
      color: #fff;
      box-shadow:
        inset 0  1px 0 oklch(100% 0 0 / .22),
        inset 0 -2px 0 oklch(0% 0 0 / .18),
        0  5px 0 var(--g900),
        0  8px 20px oklch(44% 0.18 148 / .45),
        0  2px  6px oklch(0% 0 0 / .18);
    }
    .btn-clear:hover {
      transform: translateY(-1px);
      box-shadow:
        inset 0  1px 0 oklch(100% 0 0 / .22),
        inset 0 -2px 0 oklch(0% 0 0 / .18),
        0  5px 0 var(--g900),
        0 12px 28px oklch(44% 0.18 148 / .6),
        0  2px  6px oklch(0% 0 0 / .18);
    }
    .btn-clear:active {
      transform: translateY(4px);
      box-shadow:
        inset 0 1px 0 oklch(100% 0 0 / .14),
        0 1px 0 var(--g900),
        0 3px 10px oklch(44% 0.18 148 / .3);
    }
    .btn-clear.gone { opacity: 0; pointer-events: none; }

    /* Gold */
    .btn-cta {
      background: linear-gradient(155deg, var(--au3) 0%, var(--au2) 55%, var(--au1) 100%);
      color: oklch(18% 0.06 78); text-decoration: none;
      box-shadow:
        inset 0  1px 0 oklch(100% 0 0 / .30),
        inset 0 -2px 0 oklch(0% 0 0 / .14),
        0  5px 0 var(--au1),
        0  8px 24px oklch(74% 0.18 78 / .55),
        0  2px  6px oklch(0% 0 0 / .15);
      opacity: 0; transform: translateY(16px) scale(.97); pointer-events: none;
      transition: opacity .5s .3s cubic-bezier(.4,0,.2,1), transform .5s .3s cubic-bezier(.34,1.56,.64,1), box-shadow .12s ease;
    }
    .btn-cta:hover {
      transform: translateY(-1px) !important;
      box-shadow:
        inset 0  1px 0 oklch(100% 0 0 / .32),
        inset 0 -2px 0 oklch(0% 0 0 / .14),
        0  5px 0 var(--au1),
        0 14px 36px oklch(74% 0.18 78 / .7),
        0  2px  8px oklch(0% 0 0 / .18);
    }
    .btn-cta:active {
      transform: translateY(4px) scale(1) !important;
      box-shadow:
        inset 0 1px 0 oklch(100% 0 0 / .16),
        0 1px 0 var(--au1),
        0 3px 10px oklch(74% 0.18 78 / .3);
    }
    .btn-cta.visible {
      opacity: 1; transform: translateY(0) scale(1); pointer-events: auto;
      animation: cta-breathe 2.8s 1s ease-in-out infinite;
    }
    @keyframes cta-breathe {
      0%,100% { box-shadow: inset 0 1px 0 oklch(100% 0 0 / .30), inset 0 -2px 0 oklch(0% 0 0 / .14), 0 5px 0 var(--au1), 0 8px 24px oklch(74% 0.18 78 / .55), 0 2px 6px oklch(0% 0 0 / .15); }
      50%      { box-shadow: inset 0 1px 0 oklch(100% 0 0 / .30), inset 0 -2px 0 oklch(0% 0 0 / .14), 0 5px 0 var(--au1), 0 18px 44px oklch(74% 0.18 78 / .75), 0 4px 12px oklch(0% 0 0 / .2); }
    }
    .btn-cta::after { animation-duration: 3.8s; }

    .scratch-zone.done { animation: ring-pulse .55s ease forwards; }
    @keyframes ring-pulse {
      0%  { box-shadow: inset 0 0 0 1.5px oklch(60% 0.05 148), 0 0 0 0   oklch(51% 0.19 148 / .55); }
      50% { box-shadow: inset 0 0 0 1.5px var(--g400),          0 0 0 12px oklch(51% 0.19 148 / 0);  }
      100%{ box-shadow: inset 0 0 0 1.5px var(--g400),          0 0 0 12px oklch(51% 0.19 148 / 0);  }
    }

    @media (prefers-reduced-motion: reduce) {
      .gift-wrap, .hint-hand { animation: none; }
      .btn::after, .btn-cta.visible { animation: none; }
    }
  </style>
</head>
<body>
<canvas id="ccvs"></canvas>
<canvas id="pcvs"></canvas>

<div class="scene">
  <div class="card">
    <div class="card-header">
      <p class="brand">Перекрёсток</p>
      <div class="gift-wrap" aria-hidden="true">
        <svg viewBox="0 0 92 92" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="46" cy="84" rx="28" ry="5.5" fill="oklch(0% 0 0 / .2)"/>
          <rect x="11" y="44" width="70" height="36" rx="8" fill="oklch(54% 0.20 148)"/>
          <rect x="7"  y="34" width="78" height="20" rx="7" fill="oklch(63% 0.21 148)"/>
          <rect x="7"  y="34" width="78" height="9"  rx="7" fill="oklch(100% 0 0 / .08)"/>
          <rect x="41" y="34" width="10" height="46" rx="5" fill="var(--au3)"/>
          <rect x="7"  y="41" width="78" height="7"  rx="3.5" fill="var(--au3)"/>
          <ellipse cx="32" cy="30" rx="13" ry="8.5" fill="var(--au3)" transform="rotate(-20 32 30)"/>
          <ellipse cx="60" cy="30" rx="13" ry="8.5" fill="var(--au3)" transform="rotate(20 60 30)"/>
          <circle cx="46" cy="31" r="7" fill="var(--au3)"/>
          <circle cx="46" cy="31" r="4" fill="oklch(91% 0.17 82)"/>
          <circle cx="78" cy="13" r="3.5" fill="oklch(91% 0.17 82)" opacity=".9"/>
          <circle cx="14" cy="19" r="2.5" fill="oklch(91% 0.17 82)" opacity=".7"/>
          <path d="M80 4 L81.4 8.6 L86 8.6 L82.3 11.4 L83.7 16 L80 13.2 L76.3 16 L77.7 11.4 L74 8.6 L78.6 8.6Z" fill="oklch(91% 0.17 82)"/>
        </svg>
      </div>
      <h1 class="header-title">Личный подарок</h1>
      <p class="header-sub">Стирайте — под слоем кое-что приятное</p>
    </div>

    <div class="card-body">
      <div class="scratch-zone" id="zone" role="img" aria-label="Скретч-карта">
        <canvas id="cvsPrize" aria-hidden="true"></canvas>
        <canvas id="cvsFoil"  aria-hidden="true"></canvas>
      </div>

      <div class="hint" id="hint">
        <span class="hint-hand" aria-hidden="true">👆</span>
        <span>Стирайте пальцем — под слоем сразу видно</span>
      </div>

      <div class="prog-track" id="progTrack" aria-hidden="true">
        <div class="prog-fill" id="progFill"></div>
      </div>

      <button class="btn btn-clear" id="btnClear" type="button">Стереть всё</button>

      <a class="btn btn-cta" id="btnCta"
         href="tsxapp://app/personal_offers_list"
         role="button" aria-label="Все персональные скидки">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M3 10h14M11 4l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Все мои персональные скидки
      </a>
    </div>
  </div>
</div>

<script>
/* ═══ CONFIG ═════════════════════════════════════════════
   BRUSH smaller = harder to scratch (was 38, now 22)
   More swipes needed = more satisfying
═══════════════════════════════════════════════════════ */
const BRUSH     = 22;    // smaller brush = more work to scratch
const THRESHOLD = 0.60;  // need 60% cleared
const TICK_MS   = 100;

/* ═══ ELEMENTS ══════════════════════════════════════════ */
const zone      = document.getElementById('zone');
const cvsPrize  = document.getElementById('cvsPrize');
const ctxPrize  = cvsPrize.getContext('2d');
const cvsFoil   = document.getElementById('cvsFoil');
const ctxFoil   = cvsFoil.getContext('2d');
const hint      = document.getElementById('hint');
const progFill  = document.getElementById('progFill');
const progTrk   = document.getElementById('progTrack');
const btnClear  = document.getElementById('btnClear');
const btnCta    = document.getElementById('btnCta');
const ccvs      = document.getElementById('ccvs');
const cctx      = ccvs.getContext('2d');
const pcvs      = document.getElementById('pcvs');
const pctx      = pcvs.getContext('2d');

let revealed = false, drawing = false, lastPt = null, lastTick = 0;
let flakes = [], confettiPieces = [];

/* Soft continuous rustle: one loop, no repeated noise bursts. */
let audioCtx = null, rustleGain = null, audioPoint = null;
function ensureAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const sr = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, sr * 4, sr);
      const data = buffer.getChannelData(0);
      let smooth = 0;
      for (let i = 0; i < data.length; i++) {
        smooth = 0.88 * smooth + 0.12 * (Math.random() * 2 - 1);
        // Bring both ends to zero so the loop has no seam click.
        const edge = Math.min(1, i / (sr * .12), (data.length - 1 - i) / (sr * .12));
        data[i] = smooth * Math.sin(edge * Math.PI / 2);
      }
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.loop = true;
      const highpass = audioCtx.createBiquadFilter();
      highpass.type = 'highpass'; highpass.frequency.value = 180;
      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = 'lowpass'; lowpass.frequency.value = 1200; lowpass.Q.value = 0.5;
      rustleGain = audioCtx.createGain();
      rustleGain.gain.value = 0;
      source.connect(highpass); highpass.connect(lowpass);
      lowpass.connect(rustleGain); rustleGain.connect(audioCtx.destination);
      source.start();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  } catch (_) { /* Audio is optional; scratching still works. */ }
}
function holdRustle(now) {
  const gain = rustleGain.gain;
  if (gain.cancelAndHoldAtTime) gain.cancelAndHoldAtTime(now);
  else {
    const value = gain.value;
    gain.cancelScheduledValues(now);
    gain.setValueAtTime(value, now);
  }
}
function playTick(x, y) {
  const previous = audioPoint;
  audioPoint = { x, y };
  if (!previous || !audioCtx || !rustleGain || audioCtx.state !== 'running') return;
  if (Math.hypot(x - previous.x, y - previous.y) < 0.5) return;
  const now = audioCtx.currentTime;
  holdRustle(now);
  rustleGain.gain.setTargetAtTime(0.24, now, 0.035);
  // Fade out even when the finger stays down but stops moving.
  rustleGain.gain.setTargetAtTime(0, now + 0.09, 0.035);
}
function stopRustle() {
  audioPoint = null;
  if (!audioCtx || !rustleGain) return;
  const now = audioCtx.currentTime;
  holdRustle(now);
  rustleGain.gain.setTargetAtTime(0, now, 0.025);
}
['touchend', 'touchcancel', 'mouseup', 'pointercancel', 'blur', 'pagehide'].forEach(event =>
  window.addEventListener(event, stopRustle));
document.addEventListener('visibilitychange', () => { if (document.hidden) stopRustle(); });

/* ═══ INIT ══════════════════════════════════════════════ */
function initCanvas() {
  const dpr  = devicePixelRatio || 1;
  const rect = zone.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  for (const c of [cvsPrize, cvsFoil]) { c.width = W * dpr; c.height = H * dpr; }
  ctxPrize.scale(dpr, dpr);
  ctxFoil.scale(dpr, dpr);
  ccvs.width = pcvs.width  = innerWidth;
  ccvs.height = pcvs.height = innerHeight;
  drawPrize(W, H);
  drawFoil(W, H);
}

/* ── Prize layer ── */
function drawPrize(w, h) {
  const bg = ctxPrize.createRadialGradient(w/2, h*.4, 0, w/2, h*.4, Math.max(w,h)*.7);
  bg.addColorStop(0,   'oklch(98% 0.018 80)');
  bg.addColorStop(0.6, 'oklch(96% 0.03 148)');
  bg.addColorStop(1,   'oklch(93% 0.05 148)');
  ctxPrize.fillStyle = bg;
  ctxPrize.fillRect(0, 0, w, h);

  const sheen = ctxPrize.createLinearGradient(0, 0, w, 0);
  sheen.addColorStop(0,   'oklch(82% 0.12 200 / .18)');
  sheen.addColorStop(.25, 'oklch(80% 0.14 148 / .15)');
  sheen.addColorStop(.5,  'oklch(82% 0.14 78  / .18)');
  sheen.addColorStop(.75, 'oklch(78% 0.10 310 / .12)');
  sheen.addColorStop(1,   'oklch(82% 0.12 200 / .18)');
  ctxPrize.fillStyle = sheen;
  ctxPrize.fillRect(0, 0, w, h);

  ctxPrize.save();
  ctxPrize.shadowColor = 'oklch(60% 0.12 78 / .35)';
  ctxPrize.shadowBlur  = 16;
  ctxPrize.shadowOffsetY = 4;
  const emojiSize = Math.min(h * .48, 50);
  ctxPrize.font = `${emojiSize}px serif`;
  ctxPrize.textAlign = 'center'; ctxPrize.textBaseline = 'middle';
  ctxPrize.fillText('☕', w / 2, h * .38);
  ctxPrize.restore();

  ctxPrize.save();
  ctxPrize.font = `800 ${Math.min(h * .16, 18)}px Inter, system-ui, sans-serif`;
  ctxPrize.fillStyle = 'oklch(37% 0.16 148)';
  ctxPrize.textAlign = 'center'; ctxPrize.textBaseline = 'middle';
  ctxPrize.fillText('Бесплатный кофе', w / 2, h * .68);
  ctxPrize.restore();

  ctxPrize.save();
  ctxPrize.font = `500 ${Math.min(h * .11, 12)}px Inter, system-ui, sans-serif`;
  ctxPrize.fillStyle = 'oklch(50% 0.03 148)';
  ctxPrize.textAlign = 'center'; ctxPrize.textBaseline = 'middle';
  ctxPrize.fillText('Персональный купон · только для вас', w / 2, h * .82);
  ctxPrize.restore();
}

/* ── Foil layer — DARKER, brighter label ── */
function drawFoil(w, h) {
  // Much darker base — around 42-48% lightness instead of 76-88%
  const base = ctxFoil.createLinearGradient(0, 0, w, h);
  base.addColorStop(0,   'oklch(42% 0.025 200)');
  base.addColorStop(.25, 'oklch(50% 0.020 200)');
  base.addColorStop(.55, 'oklch(44% 0.028 200)');
  base.addColorStop(.80, 'oklch(52% 0.018 200)');
  base.addColorStop(1,   'oklch(40% 0.030 200)');
  ctxFoil.fillStyle = base;
  ctxFoil.fillRect(0, 0, w, h);

  // Iridescent tint — more vivid on dark background
  const iri = ctxFoil.createLinearGradient(0, 0, w, 0);
  iri.addColorStop(0,   'oklch(75% 0.14 200 / .15)');
  iri.addColorStop(.25, 'oklch(72% 0.14 148 / .12)');
  iri.addColorStop(.5,  'oklch(75% 0.14 80  / .15)');
  iri.addColorStop(.75, 'oklch(72% 0.14 310 / .12)');
  iri.addColorStop(1,   'oklch(75% 0.14 200 / .15)');
  ctxFoil.fillStyle = iri;
  ctxFoil.fillRect(0, 0, w, h);

  // Fine grain on dark
  for (let i = 0; i < 600; i++) {
    const x = Math.random()*w, y = Math.random()*h;
    ctxFoil.beginPath();
    ctxFoil.arc(x, y, Math.random()*.9+.2, 0, Math.PI*2);
    ctxFoil.fillStyle = `oklch(${Math.random()>.5?70:30}% 0.02 200 / ${Math.random()*.18+.03})`;
    ctxFoil.fill();
  }

  // Bright specular streak — more visible on dark
  const streak = ctxFoil.createLinearGradient(0, h*.35, 0, h*.47);
  streak.addColorStop(0,  'oklch(100% 0 0 / 0)');
  streak.addColorStop(.5, 'oklch(100% 0 0 / .22)');
  streak.addColorStop(1,  'oklch(100% 0 0 / 0)');
  ctxFoil.fillStyle = streak;
  ctxFoil.fillRect(0, h*.35, w, h*.12);

  // BRIGHT label — white + glow on dark foil
  // Glow pass
  ctxFoil.save();
  ctxFoil.shadowColor = 'oklch(100% 0 0 / .9)';
  ctxFoil.shadowBlur  = 12;
  ctxFoil.font = `700 14px Inter, system-ui, sans-serif`;
  ctxFoil.textAlign = 'center'; ctxFoil.textBaseline = 'middle';
  ctxFoil.fillStyle = 'oklch(95% 0.04 80)'; // warm white
  ctxFoil.fillText('✦  С Т И Р А Й  ✦', w/2, h/2);
  ctxFoil.restore();
  // Second pass without shadow for crispness
  ctxFoil.save();
  ctxFoil.font = `700 14px Inter, system-ui, sans-serif`;
  ctxFoil.textAlign = 'center'; ctxFoil.textBaseline = 'middle';
  ctxFoil.fillStyle = '#fff';
  ctxFoil.fillText('✦  С Т И Р А Й  ✦', w/2, h/2);
  ctxFoil.restore();
}

/* ═══ SCRATCH ═══════════════════════════════════════════ */
function getPos(e) {
  const rect = cvsFoil.getBoundingClientRect();
  const src = e.changedTouches ? e.changedTouches[0] : e;
  // The context is already scaled by DPR. Convert screen coordinates
  // to its logical drawing units, not to physical pixels a second time.
  const transform = ctxFoil.getTransform();
  return {
    x: (src.clientX - rect.left) * cvsFoil.width / rect.width / transform.a,
    y: (src.clientY - rect.top) * cvsFoil.height / rect.height / transform.d,
  };
}

function scratchAt(x, y) {
  ctxFoil.globalCompositeOperation = 'destination-out';
  if (lastPt) {
    ctxFoil.beginPath();
    ctxFoil.moveTo(lastPt.x, lastPt.y);
    ctxFoil.lineTo(x, y);
    ctxFoil.lineWidth = BRUSH * 2; ctxFoil.lineCap = 'round'; ctxFoil.lineJoin = 'round';
    ctxFoil.stroke();
  }
  ctxFoil.beginPath();
  ctxFoil.arc(x, y, BRUSH, 0, Math.PI*2);
  ctxFoil.fill();
  lastPt = {x, y};

  if (navigator.vibrate) navigator.vibrate(4);
  playTick(x, y);
  spawnFlakes(x, y);   // more flakes, bigger, darker colour

  const now = performance.now();
  if (now - lastTick > TICK_MS) { lastTick = now; checkCoverage(); }
}

/* ═══ COVERAGE ══════════════════════════════════════════ */
function checkCoverage() {
  if (revealed) return;
  const d = ctxFoil.getImageData(0, 0, cvsFoil.width, cvsFoil.height).data;
  let cleared = 0;
  for (let i = 3; i < d.length; i += 32) if (d[i] < 100) cleared++;
  const pct = cleared / (d.length / 32);
  progFill.style.width = Math.min(pct * 100, 100) + '%';
  if (pct >= THRESHOLD) revealAll();
}

/* ═══ REVEAL ════════════════════════════════════════════ */
function revealAll() {
  if (revealed) return;
  stopRustle();
  revealed = true;
  progFill.style.width = '100%';
  cvsFoil.classList.add('fading');
  zone.classList.add('done');
  hint.classList.add('gone');
  progTrk.classList.add('gone');
  btnClear.classList.add('gone');
  if (navigator.vibrate) navigator.vibrate([35,55,35,55,90]);
  setTimeout(() => btnCta.classList.add('visible'), 650);
  setTimeout(launchConfetti, 380);
}

/* ═══ EVENTS ════════════════════════════════════════════ */
zone.addEventListener('touchstart', e => {
  e.preventDefault(); if (revealed) return;
  ensureAudio(); drawing = true; lastPt = null;
  const p = getPos(e); scratchAt(p.x, p.y);
}, {passive:false});
zone.addEventListener('touchmove', e => {
  e.preventDefault(); if (!drawing || revealed) return;
  const p = getPos(e); scratchAt(p.x, p.y);
}, {passive:false});
zone.addEventListener('touchend', () => { drawing = false; lastPt = null; });
zone.addEventListener('mousedown', e => {
  if (revealed) return;
  ensureAudio(); drawing = true; lastPt = null;
  const p = getPos(e); scratchAt(p.x, p.y);
});
zone.addEventListener('mousemove', e => {
  if (!drawing || revealed) return;
  const p = getPos(e); scratchAt(p.x, p.y);
});
window.addEventListener('mouseup', () => { drawing = false; lastPt = null; });
btnClear.addEventListener('click', () => { ensureAudio(); revealAll(); });

[btnClear, btnCta].forEach(btn =>
  btn.addEventListener('pointerdown', e => {
    const r = btn.getBoundingClientRect();
    const size = Math.max(r.width, r.height) * 1.5;
    const el = document.createElement('span');
    el.className = 'ripple';
    el.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px;`;
    btn.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  })
);

/* ═══ FLAKES — foil chips flying off ═══════════════════
   Dark silver + gold chips, larger, more of them
═══════════════════════════════════════════════════════ */
const FLAKE_COLORS = [
  // Dark foil chips (matches the new dark foil)
  'oklch(42% 0.02 200)',
  'oklch(52% 0.03 200)',
  'oklch(38% 0.02 200)',
  'oklch(60% 0.02 200)',
  // Gold flecks
  'oklch(78% 0.14 82)',
  'oklch(65% 0.12 78)',
  // Bright specular flakes
  'oklch(88% 0.02 200)',
];

function spawnFlakes(cx, cy) {
  // Spawn more flakes (was 38%, now always spawn 2-5)
  const count = Math.floor(Math.random() * 4) + 2;
  const rect = cvsFoil.getBoundingClientRect();
  const transform = ctxFoil.getTransform();
  // Inverse of getPos: flakes originate exactly at the touch point.
  const sx = rect.left + cx * transform.a * rect.width / cvsFoil.width;
  const sy = rect.top + cy * transform.d * rect.height / cvsFoil.height;

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 2;       // faster
    const size  = Math.random() * 5 + 2;       // bigger (was 3.5+1.5)
    // Random shape: circle or small rect
    const isRect = Math.random() > .5;
    flakes.push({
      x: sx + (Math.random()-0.5)*4,
      y: sy + (Math.random()-0.5)*4,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2.5,
      r: size,
      w: isRect ? size * 2.2 : size,     // rect width
      h: isRect ? size * 0.9 : size,     // rect height
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.4,  // rotation speed
      isRect,
      a: 0.92,
      c: FLAKE_COLORS[Math.floor(Math.random() * FLAKE_COLORS.length)],
    });
  }
}

function tickFlakes() {
  pctx.clearRect(0, 0, pcvs.width, pcvs.height);
  flakes = flakes.filter(p => p.a > .02);
  for (const p of flakes) {
    p.x  += p.vx; p.y += p.vy; p.vy += .20;  // gravity
    p.rot += p.vr;
    p.a  *= 0.87;
    pctx.save();
    pctx.globalAlpha = p.a;
    pctx.fillStyle   = p.c;
    if (p.isRect) {
      pctx.translate(p.x, p.y); pctx.rotate(p.rot);
      pctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    } else {
      pctx.beginPath(); pctx.arc(p.x, p.y, p.r, 0, Math.PI*2); pctx.fill();
    }
    pctx.restore();
  }
  requestAnimationFrame(tickFlakes);
}
tickFlakes();

/* ═══ CONFETTI ══════════════════════════════════════════ */
const CONF = ['oklch(51% 0.19 148)','oklch(63% 0.18 148)','oklch(84% 0.17 82)','#ffffff','oklch(86% 0.09 148)','oklch(74% 0.17 78)'];
function launchConfetti() {
  ccvs.width = innerWidth; ccvs.height = innerHeight;
  confettiPieces = [];
  for (let i = 0; i < 140; i++) confettiPieces.push({
    x: Math.random()*innerWidth,
    y: -20-Math.random()*innerHeight*.25,
    w: Math.random()*10+5, h: Math.random()*6+3,
    r: Math.random()*Math.PI*2, vx: (Math.random()-.5)*5,
    vy: Math.random()*4+2.5, vr: (Math.random()-.5)*.14,
    c: CONF[Math.floor(Math.random()*CONF.length)], life: 1,
  });
  tickConf();
}
function tickConf() {
  cctx.clearRect(0,0,ccvs.width,ccvs.height);
  let any = false;
  for (const p of confettiPieces) {
    if (p.life<=0||p.y>ccvs.height){p.life=0;continue;}
    p.x+=p.vx; p.y+=p.vy; p.vy+=.055; p.r+=p.vr; p.life-=.005;
    any=true;
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.r);
    cctx.globalAlpha=Math.max(p.life,0); cctx.fillStyle=p.c;
    cctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cctx.restore();
  }
  if (any) requestAnimationFrame(tickConf);
}

/* ═══ RESIZE ════════════════════════════════════════════ */
window.addEventListener('resize', () => {
  if (!revealed) initCanvas();
  pcvs.width=ccvs.width=innerWidth; pcvs.height=ccvs.height=innerHeight;
});

requestAnimationFrame(() => requestAnimationFrame(initCanvas));
</script>
</body>
</html>
